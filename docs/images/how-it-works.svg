<rect x="24" y="40" width="150" height="76" rx="10" fill="#eef0fe" stroke="#5b6cf0"/>
<text x="99" y="72" font-weight="600" fill="#1d2030">Press Ctrl + ;</text>
<text x="99" y="94" font-size="12" fill="#5d6275">tap, or hold to talk</text>
