[package]
name = "tdt-setup"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Per-user TDT installer stub. packaging/build-installer.ps1 appends the payload zip."

[[bin]]
name = "tdt-setup"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
