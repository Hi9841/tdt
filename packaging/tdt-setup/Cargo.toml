[package]
name = "tdt-setup"
version = "0.2.2"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
description = "TDT-Setup.exe: installs, updates, and uninstalls TDT. packaging/build-installer.ps1 appends the app."

[[bin]]
name = "tdt-setup"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
miniz_oxide = "0.8"
sha2 = "0.10"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
