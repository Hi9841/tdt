[package]
name = "voice-stt-desktop"
version = "0.2.16"
edition = "2021"
description = "TDT (Talk Don't Type), native offline speech-to-text built with Rust, GPUI, and Sherpa-ONNX"
license = "Apache-2.0"
readme = "../README.md"
homepage = "https://github.com/Hi9841/tdt"
repository = "https://github.com/Hi9841/tdt"
documentation = "https://github.com/Hi9841/tdt#readme"
authors = ["Hi9841"]
keywords = ["speech-to-text", "dictation", "sensevoice", "offline"]
categories = ["accessibility", "multimedia::audio", "os::windows-apis"]

[lib]
name = "voice_stt_desktop"
path = "src/lib.rs"

[[bin]]
name = "TDT"
path = "src/main.rs"

[[bin]]
name = "bench-asr"
path = "src/bin/bench_asr.rs"

[dependencies]
# Ely pins this Zed revision. A crates.io gpui would be a different type universe.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", default-features = false, features = ["stacker"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", features = ["font-kit"] }
ely-gpui-component = { git = "https://github.com/ZacharyZhang-NY/Ely-GPUI-Components" }
sherpa-onnx = "1.13.8"
cpal = "0.15"
arboard = "3.4"
# Linux AppIndicator pulls an old glib stack that cannot share a lockfile with Zed's GPUI.
tray-icon = { version = "0.26", default-features = false }
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell"
] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
