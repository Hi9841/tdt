[package]
name = "voice-stt-desktop"
version = "0.1.0"
edition = "2021"
description = "TDT (Talk Don't Type), native offline speech-to-text built with Rust, GPUI, and Sherpa-ONNX"
license = "Apache-2.0"
readme = "../README.md"
homepage = "https://github.com/Hi9841/tdt"
repository = "https://github.com/Hi9841/tdt"
documentation = "https://github.com/Hi9841/tdt#readme"
authors = ["Hi9841"]
keywords = ["speech-to-text", "dictation", "sensevoice", "offline"]
categories = ["accessibility", "multimedia::audio", "os::windows-apis"]

[dependencies]
gpui = "0.2.2"
sherpa-onnx = "1.13.8"
cpal = "0.15"
arboard = "3.4"
enigo = { version = "0.3", default-features = false }
tray-icon = "0.19"
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
