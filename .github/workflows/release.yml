name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download SenseVoice model
        shell: pwsh
        run: |
          $script = Join-Path $pwd "models/download-models.ps1"
          & $script
      - name: Build installer
        shell: pwsh
        run: |
          $script = Join-Path $pwd "packaging/build-installer.ps1"
          & $script -Version "${{ github.ref_name }}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TDT-Setup.exe
            dist/TDT-*-windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
