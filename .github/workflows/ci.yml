name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Installer stub
        run: |
          cargo fmt --manifest-path packaging/tdt-setup/Cargo.toml -- --check
          cargo test --manifest-path packaging/tdt-setup/Cargo.toml
          cargo clippy --manifest-path packaging/tdt-setup/Cargo.toml --all-targets -- -D warnings
