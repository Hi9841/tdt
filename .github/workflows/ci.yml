name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: ./.github/actions/cargo-fork
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The fork keeps intermediate files here, not in ./target.
          cache-directories: ~/.cargo/targets
      - name: No word lists
        shell: bash
        # TDT decodes with the model alone; Trit (Hi9841/trit) guards its own code.
        run: |
          if git grep -n 'include_str!' -- desktop/src \
            || git ls-files -- desktop/src desktop/assets | grep -E '\.(txt|json|csv|tsv)$'; then
            echo "error: a word list ships in the app; TDT decodes with the model alone"
            exit 1
          fi
      - name: Format
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - name: Build
        run: cargo build --locked --manifest-path desktop/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Installer stub
        run: |
          cargo fmt --manifest-path packaging/tdt-setup/Cargo.toml -- --check
          cargo build --locked --manifest-path packaging/tdt-setup/Cargo.toml
          cargo clippy --locked --manifest-path packaging/tdt-setup/Cargo.toml --all-targets -- -D warnings
