name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: No word lists
        shell: bash
        # Trit and TDT decode with the model alone (trit/AGENTS.md).
        run: |
          if git grep -n 'include_str!' -- trit/src trit/ffi desktop/src \
            || git ls-files -- trit/src desktop/src desktop/assets | grep -E '\.(txt|json|csv|tsv)$'; then
            echo "error: a word list ships in the engine or the app; Trit and TDT decode with the model alone"
            exit 1
          fi
      - name: Format
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - name: Build
        run: cargo build --locked --manifest-path desktop/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Trit engine
        run: |
          cargo fmt --manifest-path trit/Cargo.toml --all -- --check
          cargo build --locked --release --manifest-path trit/Cargo.toml --workspace
          cargo clippy --locked --manifest-path trit/Cargo.toml --workspace --all-targets -- -D warnings
          trit/target/release/trit.exe skill --check trit/skill/SKILL.md
      - name: Installer stub
        run: |
          cargo fmt --manifest-path packaging/tdt-setup/Cargo.toml -- --check
          cargo build --locked --manifest-path packaging/tdt-setup/Cargo.toml
          cargo clippy --locked --manifest-path packaging/tdt-setup/Cargo.toml --all-targets -- -D warnings
